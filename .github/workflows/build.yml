# Every push to main: the Windows, macOS and Linux apps are built and tested, and their packages are published as the GitHub
# release v<Version> (the <Version> in src/JunkCleanup/JunkCleanup.csproj, shared by both apps). While the version stays the same, each push
# replaces that release's files and moves its tag to the new commit; a new version number makes a new release.
# Pull requests are built and tested only.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test and build (one self-contained exe)
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\JunkCleanup
        run: |
          ./build.ps1 -Test -Exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleanup-Windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test and build (universal)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          INSTALL_DIR: ${{ runner.temp }}/Applications
        run: ./build.sh --test --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleanup-macOS
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test and build (x64 AppImage)
        run: ./build-linux.sh --test

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleanup-Linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/JunkCleanup/JunkCleanup.csproj | head -1)
          TAG="v$VERSION"
          sed "s/<version>/$VERSION/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The same version again: the tag moves to this commit and the files are replaced.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" dist/* --clobber
            # Files of an earlier build that this one no longer makes are removed.
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "JunkCleanup $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "JunkCleanup $TAG" \
              --notes-file notes.md
          fi
