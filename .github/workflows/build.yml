# Every push to main: the Windows, macOS and Linux apps are built and tested, and their packages are published as the GitHub
# release v<Version> (the <Version> in src/JunkCleanup/JunkCleanup.csproj, shared by both apps). While the version stays the same, each push
# replaces that release's files and moves its tag to the new commit; a new version number makes a new release.
# Pull requests are built and tested only.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JunkCleanup.slnx

      - name: Build
        run: dotnet build JunkCleanup.slnx -c Release --no-restore

      - name: Test
        run: dotnet test JunkCleanup.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/JunkCleanup/JunkCleanup.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:DebugType=none
          -o publish/fdd

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/JunkCleanup/JunkCleanup.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish/sc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/fdd/* -DestinationPath dist/JunkCleanup-win-x64.zip
          Compress-Archive -Path publish/sc/* -DestinationPath dist/JunkCleanup-win-x64-selfcontained.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleanup-win-x64
          path: dist/*.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test and build (universal)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          INSTALL_DIR: ${{ runner.temp }}/Applications
        run: ./build.sh --test --zip

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleanup-macOS
          path: dist/JunkCleanup-macOS.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test and build (x64 tar.gz and AppImage)
        run: ./build-linux.sh --test --appimage

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleanup-linux-x64
          path: |
            dist/JunkCleanup-linux-x64.tar.gz
            dist/JunkCleanup-x86_64.AppImage

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/JunkCleanup/JunkCleanup.csproj | head -1)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The same version again: the tag moves to this commit and the files are replaced.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" dist/* --clobber
            # Files of an earlier build that this one no longer makes are removed.
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "JunkCleanup $TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "JunkCleanup $TAG" \
              --notes-file .github/release-notes.md
          fi
